<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 730 1100 260" role="img" aria-labelledby="title desc">
  <title id="title">Example of Rule II shrinking a box</title>
  <desc id="desc">Four box-shrinking stages illustrating Rule II.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#aaa" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="1080" fill="#fff"/>

  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#222">
    <g transform="translate(30 750)">
      <rect width="180" height="180" fill="#fff"/><rect width="180" height="90" fill="#f1c9a6"/><rect y="90" width="180" height="90" fill="#b9d9d2"/>
      <rect width="180" height="180" fill="url(#grid)" stroke="#168260" stroke-width="4"/>
      <path d="M0 180H44M0 180V145" fill="none" stroke="#0758e8" stroke-width="6"/>
      <path d="M178 85V98" stroke="#e33" stroke-width="6"/>
      <text x="90" y="58">B2</text><text x="90" y="145">B1</text>
      <text x="90" y="214" font-size="17">1. Split the box</text>
    </g>
    <g transform="translate(315 750)">
      <rect width="180" height="180" fill="#fff"/><rect y="90" width="90" height="90" fill="#b9d9d2"/><rect x="90" y="90" width="90" height="90" fill="#f1c9a6"/>
      <rect width="180" height="180" fill="url(#grid)" stroke="#aaa" stroke-width="3"/>
      <path d="M0 180H44M0 180V145" fill="none" stroke="#0758e8" stroke-width="6"/>
      <path d="M55 90H180M178 96V112" fill="none" stroke="#e33" stroke-width="6"/>
      <text x="45" y="143">B1</text><text x="135" y="143">B2</text>
      <text x="90" y="214" font-size="17">2. Keep reachable side</text>
    </g>
    <g transform="translate(600 750)">
      <rect width="180" height="180" fill="#fff"/><rect width="90" height="90" fill="#f1c9a6"/><rect y="90" width="90" height="90" fill="#b9d9d2"/>
      <rect width="180" height="180" fill="url(#grid)" stroke="#aaa" stroke-width="3"/>
      <path d="M0 180H44M0 180V145" fill="none" stroke="#0758e8" stroke-width="6"/>
      <path d="M88 47V68" stroke="#e33" stroke-width="6"/>
      <text x="45" y="58">B2</text><text x="45" y="145">B1</text>
      <text x="90" y="214" font-size="17">3. Shrink again</text>
    </g>
    <g transform="translate(885 750)">
      <rect width="180" height="180" fill="#fff"/><rect x="0" y="60" width="45" height="60" fill="#b9d9d2"/><rect x="45" y="60" width="45" height="60" fill="#f1c9a6"/>
      <rect width="180" height="180" fill="url(#grid)" stroke="#aaa" stroke-width="3"/>
      <path d="M0 120H44M0 120V91" fill="none" stroke="#0758e8" stroke-width="6"/>
      <path d="M42 60H91M88 65V78" fill="none" stroke="#e33" stroke-width="6"/>
      <text x="22" y="97" font-size="14">B1</text><text x="67" y="97" font-size="14">B2</text>
      <text x="90" y="214" font-size="17">4. Process smaller box</text>
    </g>
  </g>
</svg>

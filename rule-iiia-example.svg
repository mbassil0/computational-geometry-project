<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 260" role="img" aria-labelledby="title desc">
  <title id="title">Rule IIIa example with an empty right boundary</title>
  <desc id="desc">A grid with a selected box in the lower-left. Blue input intervals enter from its left and bottom edges; its right edge is marked red and has no free points.</desc>
  <defs>
    <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse">
      <path d="M27 0H0V27" fill="none" stroke="#c5c5c5" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="180" height="260" fill="#fff"/>
  <rect x="7" y="10" width="162" height="243" fill="url(#grid)" stroke="#c5c5c5" stroke-width="1.5"/>
  <rect x="7" y="172" width="81" height="54" fill="none" stroke="#303030" stroke-width="3" stroke-dasharray="8 5"/>
  <path d="M7 182V226M7 226H54" fill="none" stroke="#0758e8" stroke-width="5" stroke-linecap="round"/>
  <path d="M88 172V226" fill="none" stroke="#d24637" stroke-width="4" stroke-dasharray="7 5"/>
</svg>
